<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchpoint — シリーズを作成</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<style>
/* [軽量版] @font-face 除去 */
  :root {
    --bg:#0B0E14; --surface:#141A24; --surface-2:#1B2230; --surface-3:#242D3D;
    --border:#29323F; --border-strong:#3A4657;
    --fg:#EDF1F8; --fg-muted:#97A2B6; --fg-subtle:#667084;
    --brand:#FF6A2B; --brand-hover:#FF7E48; --brand-press:#E85A1E; --on-brand:#21110A;
    --accent:#22D3EE;
    --success:#34D399; --warning:#F5B93D; --live:#22D3EE; --danger:#F65C4E;
    --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:14px; --r-2xl:18px;
    --e1:0 1px 2px rgba(0,0,0,.4); --e2:0 4px 14px rgba(0,0,0,.45); --e3:0 12px 32px rgba(0,0,0,.5);
    --font-jp:"Noto Sans JP",system-ui,sans-serif;
    --font-sans:"Geist",var(--font-jp);
    --font-mono:"Geist Mono",ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  body {
    margin:0; color:var(--fg); font-family:var(--font-jp); line-height:1.6;
    font-feature-settings:"palt" 1;
    background:
      radial-gradient(1100px 520px at 86% -8%, rgba(255,106,43,.09), transparent 58%),
      radial-gradient(820px 460px at 4% 2%, rgba(34,211,238,.06), transparent 54%),
      var(--bg);
    min-height:100vh;
  }
  a { color:var(--brand); text-decoration:none; }
  a:hover { color:var(--brand-hover); }
  .mono { font-family:var(--font-mono); font-feature-settings:"tnum" 1; }

  /* ── Site header ── */
  .site-header { border-bottom:1px solid var(--border); background:linear-gradient(180deg,rgba(20,26,36,.72),rgba(11,14,20,.72)); backdrop-filter:blur(8px); position:sticky; top:0; z-index:40; }
  .header-inner { max-width:1180px; margin:0 auto; padding:0 34px; height:60px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .brand-nav { display:flex; align-items:center; gap:34px; }
  .logo { font-family:var(--font-sans); font-weight:800; font-size:18px; letter-spacing:-.02em; display:inline-flex; align-items:center; gap:10px; color:var(--fg); }
  .logo .dot { width:9px; height:9px; border-radius:50%; background:var(--brand); box-shadow:0 0 12px var(--brand); }
  .brand-nav nav { display:flex; gap:22px; font-size:13.5px; color:var(--fg-muted); }
  .brand-nav nav a.active { color:var(--fg); font-weight:500; }
  .brand-nav nav a:hover { color:var(--fg); }
  .header-right { display:flex; align-items:center; gap:14px; font-size:13.5px; }
  .bell { position:relative; width:36px; height:36px; display:grid; place-items:center; border-radius:var(--r-md); cursor:pointer; }
  .bell:hover { background:var(--surface-2); }
  .bell .count { position:absolute; top:-1px; right:-1px; min-width:18px; height:18px; padding:0 4px; border-radius:999px; background:var(--danger); color:#fff; font-family:var(--font-mono); font-size:10px; font-weight:600; display:grid; place-items:center; box-shadow:0 0 0 2px var(--bg); }
  .header-user { display:inline-flex; align-items:center; gap:9px; }
  .header-user .av { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#5865F2,#3B45B5); display:grid; place-items:center; font-family:var(--font-sans); font-size:11px; font-weight:700; color:#fff; }
  .header-user .nm { color:var(--fg); font-weight:500; }

  /* ── Page shell ── */
  .page { max-width:720px; margin:0 auto; padding:26px 34px 120px; }
  .crumb { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--fg-muted); margin-bottom:26px; }
  .crumb a { color:var(--fg-muted); }
  .crumb a:hover { color:var(--fg); }
  .crumb .sep { color:var(--fg-subtle); }
  .crumb .cur { color:var(--fg); }

  .kicker { font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin:0 0 10px; display:flex; align-items:center; gap:9px; }
  .kicker::before { content:""; width:22px; height:2px; background:var(--accent); }
  h1.page-title { font-family:var(--font-sans); font-weight:800; font-size:30px; line-height:1.14; letter-spacing:-.02em; margin:0; }
  .page-lede { color:var(--fg-muted); font-size:14px; margin:12px 0 0; max-width:600px; }

  /* ── Form ── */
  form { margin-top:30px; display:flex; flex-direction:column; gap:20px; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-2xl); box-shadow:var(--e1); padding:24px 24px 26px; }
  .card-head { display:flex; align-items:baseline; gap:12px; margin-bottom:20px; }
  .card-head .n { font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.14em; color:var(--brand); }
  .card-head h2 { font-family:var(--font-sans); font-weight:800; font-size:16px; letter-spacing:-.01em; margin:0; }

  .field { display:block; }
  .field + .field { margin-top:18px; }
  .field > label { display:flex; align-items:baseline; font-size:13px; font-weight:600; color:var(--fg); margin-bottom:7px; }
  .field .req { color:var(--brand); margin-left:3px; }
  .field .opt { color:var(--fg-subtle); font-weight:400; font-size:11.5px; margin-left:6px; }
  .field .counter { margin-left:auto; font-family:var(--font-mono); font-feature-settings:"tnum" 1; font-size:11px; color:var(--fg-subtle); }
  .field .counter.over { color:var(--danger); }
  .hint { font-size:11.5px; color:var(--fg-muted); margin:7px 0 0; line-height:1.6; }

  input[type=text], textarea {
    width:100%; font-family:var(--font-jp); font-size:13.5px; color:var(--fg);
    background:var(--surface-3); border:1px solid var(--border); border-radius:var(--r-md);
    padding:9px 12px; line-height:1.4; transition:border-color .15s, box-shadow .15s, background .15s;
  }
  textarea { resize:vertical; min-height:120px; line-height:1.7; }
  input::placeholder, textarea::placeholder { color:var(--fg-subtle); }
  input:focus, textarea:focus {
    outline:none; border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(255,106,43,.18); background:var(--surface-2);
  }

  /* submit */
  .submit-wrap { margin-top:4px; }
  .btn-submit { width:100%; font-family:var(--font-sans); font-weight:700; font-size:14.5px; color:var(--on-brand); background:var(--brand); border:none; border-radius:var(--r-lg); padding:14px; cursor:pointer; transition:background .15s, transform .05s; box-shadow:0 0 0 1px rgba(255,106,43,.35), 0 8px 22px rgba(255,106,43,.22); }
  .btn-submit:hover { background:var(--brand-hover); }
  .btn-submit:active { transform:translateY(1px); }
  .submit-note { text-align:center; font-size:11.5px; color:var(--fg-subtle); margin:12px 0 0; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-nav">
      <span class="logo"><span class="dot"></span>Matchpoint</span>
      <nav>
        <a href="#">イベント一覧</a>
        <a href="#" class="active">シリーズ</a>
        <a href="#">イベント作成</a>
      </nav>
    </div>
    <div class="header-right">
      <span class="bell">🔔<span class="count mono">3</span></span>
      <span class="header-user"><span class="av">no</span><span class="nm">nori#1121</span></span>
    </div>
  </div>
</header>

<main class="page" data-screen-label="シリーズ作成">

  <nav class="crumb">
    <a href="#">シリーズ一覧</a>
    <span class="sep">/</span>
    <span class="cur">新規作成</span>
  </nav>

  <p class="kicker">主催者ツール</p>
  <h1 class="page-title">シリーズを作成</h1>
  <p class="page-lede">継続開催の企画をまとめるシリーズを作ります。作成後、詳細ページから開催回を追加したり、運営メンバーを招待できます。</p>

  <form id="series-form" autocomplete="off">

    <section class="card">
      <div class="card-head"><span class="n">01</span><h2>基本情報</h2></div>

      <div class="field">
        <label for="name">シリーズ名<span class="req">*</span><span class="counter" id="nameCounter">0 / 100</span></label>
        <input id="name" name="name" type="text" maxlength="100" placeholder="Matchpoint Open シリーズ">
        <p class="hint">一覧や各開催回に表示される名前です。100 文字まで。</p>
      </div>

      <div class="field">
        <label for="description">説明<span class="opt">任意</span><span class="counter" id="descCounter">0 / 2000</span></label>
        <textarea id="description" name="description" rows="6" maxlength="2000" placeholder="シリーズの趣旨・対象ゲーム・開催ペースなどを記載します。"></textarea>
        <p class="hint">シリーズ詳細ページのヒーローに表示されます。2000 文字まで。</p>
      </div>
    </section>

    <div class="submit-wrap">
      <button type="submit" class="btn-submit">この内容で作成する</button>
      <p class="submit-note">作成すると、あなたがオーナーのシリーズとして登録されます。</p>
    </div>
  </form>
</main>

<script>
(function(){
  function bindCounter(inputId, counterId, max){
    var input = document.getElementById(inputId);
    var counter = document.getElementById(counterId);
    function sync(){
      var len = input.value.length;
      counter.textContent = len + ' / ' + max;
      counter.classList.toggle('over', len > max);
    }
    input.addEventListener('input', sync); sync();
  }
  bindCounter('name', 'nameCounter', 100);
  bindCounter('description', 'descCounter', 2000);
  document.getElementById('series-form').addEventListener('submit', function(e){ e.preventDefault(); });
})();
</script>


</body></html>
